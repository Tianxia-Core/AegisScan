name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:



env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  python-suite:
    name: Python 8-Domain Scanner Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v
      - name: Self-Audit Repository
        run: python3 score_calculator.py --target . --fail-under 90

  go-suite:
    name: Go Static Binary & Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go Unit Tests
        run: go test -v -race ./...
      - name: Cross-Compile Static Executables
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/aegis-scan-linux-x86_64 ./cmd/aegis-scan
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/aegis-scan-linux-aarch64 ./cmd/aegis-scan
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/aegis-scan-windows-x86_64.exe ./cmd/aegis-scan
      - name: Self-Audit via Static Binary
        run: ./dist/aegis-scan-linux-x86_64 --target . --fail-under 90
